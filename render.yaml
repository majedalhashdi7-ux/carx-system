# render.yaml — Render Deployment Configuration
# ✅ يدعم Socket.io WebSocket الكامل (خادم مستمر)
# ✅ يشمل كل متغيرات البيئة المطلوبة لـ HM CAR + CAR X
#
# خطوات النشر:
# 1. ارفع هذا الملف مع كود المشروع على GitHub
# 2. اذهب إلى https://render.com → New → Web Service
# 3. اربطه بمستودع GitHub هذا
# 4. Render سيقرأ هذا الملف تلقائياً
# 5. أضف المتغيرات السرية يدوياً في Dashboard

services:
  - type: web
    name: hmcar-backend
    env: node
    region: oregon          # أقرب region لمنطقتك — يمكن تغييره
    plan: free              # غيّر إلى starter ($7/m) لـ Cold Start أسرع
    branch: main
    buildCommand: npm install --production
    startCommand: node server.js
    healthCheckPath: /api/health
    
    # متغيرات البيئة — القيم السرية أضفها يدوياً في Render Dashboard
    envVars:
      # ── النظام ──
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4001"
      - key: SYSTEM_VERSION
        value: "2.0.0"
      
      # ── قاعدة البيانات (أضف القيمة الحقيقية في Dashboard) ──
      - key: MONGO_URI
        sync: false          # لا يُقرأ من الملف — يُضاف يدوياً
      - key: MONGO_URI_HMCAR
        sync: false
      - key: MONGO_URI_CARX
        sync: false
      
      # ── الأمان (أضف القيم الحقيقية في Dashboard) ──
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      
      # ── CORS — روابط Frontend ──
      - key: ALLOWED_ORIGINS
        value: "https://hmcar-system-two.vercel.app,https://carx-system-five.vercel.app,https://hmcar.xyz"
      
      # ── WebSocket Backend URL (Render يوفر هذا تلقائياً) ──
      # RENDER_EXTERNAL_URL يُضبط تلقائياً من Render
      
      # ── Cloudinary (أضف في Dashboard) ──
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      
      # ── Push Notifications (أضف في Dashboard) ──
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:admin@hmcar.com"
      
      # ── Email (اختياري) ──
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      
      # ── أسعار الصرف الافتراضية ──
      - key: USD_TO_SAR
        value: "3.75"
      - key: USD_TO_KRW
        value: "1300"
      
      # ── الأدمن ──
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
